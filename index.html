<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./output.css">
  <title>Frontend Mentor | Hotel booking confirmation page</title>
</head>

<body class="bg-[#fdf8f1] font-['DM_Sans'] text-[#2f2924] antialiased">

  <div class="min-h-screen lg:grid lg:grid-cols-[280px_1fr]">

    <aside class="hidden bg-[#2f2924] text-white lg:block">
      <div class="flex min-h-screen flex-col p-8">
        <img src="./assets/images/logo.svg" alt="Maison Soleil" class="w-44">

        <nav aria-label="Guest navigation" class="mt-10">
          <ul class="space-y-2 text-sm">
            <li>
              <a href="#" class="flex items-center gap-3 rounded-xl bg-white/10 px-3 py-3">
                <img src="./assets/images/icon-bed.svg" alt="" class="h-5 w-5">
                <span>Your stay</span>
                <span class="ml-auto rounded-full bg-[#f2c85b] px-2 py-0.5 text-xs text-[#2f2924]">1</span>
              </a>
            </li>
            <li>
              <a href="#" class="flex items-center gap-3 rounded-xl px-3 py-3 text-white/80 hover:bg-white/10 hover:text-white">
                <img src="./assets/images/icon-house.svg" alt="" class="h-5 w-5">
                <span>The house</span>
              </a>
            </li>
            <li>
              <a href="#" class="flex items-center gap-3 rounded-xl px-3 py-3 text-white/80 hover:bg-white/10 hover:text-white">
                <img src="./assets/images/icon-pin.svg" alt="" class="h-5 w-5">
                <span>Around town</span>
              </a>
            </li>
            <li>
              <a href="#" class="flex items-center gap-3 rounded-xl px-3 py-3 text-white/80 hover:bg-white/10 hover:text-white">
                <img src="./assets/images/icon-breakfast.svg" alt="" class="h-5 w-5">
                <span>Breakfast</span>
              </a>
            </li>
            <li>
              <a href="#" class="flex items-center gap-3 rounded-xl px-3 py-3 text-white/80 hover:bg-white/10 hover:text-white">
                <img src="./assets/images/icon-mail.svg" alt="" class="h-5 w-5">
                <span>Messages</span>
              </a>
            </li>
          </ul>
        </nav>

        <div class="mt-10 border-t border-white/10 pt-6">
          <div class="flex items-start gap-3">
            <img src="./assets/images/icon-weather.svg" alt="" class="mt-1 h-6 w-6">
            <div>
              <p class="text-xs uppercase tracking-[0.2em] text-white/50">Today in Cassis</p>
              <div class="mt-1 flex items-end gap-2">
                <p class="text-3xl font-semibold">27°</p>
                <p class="pb-1 text-xs text-white/60">Sunny · light breeze</p>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-auto pt-10 text-[11px] leading-5 text-white/50">
          <p>Est. 1987</p>
          <p>Maison Soleil · 12 Rue des Oliviers · Cassis</p>
          <p>© 2026 Maison Soleil</p>
        </div>
      </div>
    </aside>

    <main class="min-w-0 bg-[#fdf8f1]">
      <div class="mx-auto max-w-6xl px-5 py-8 sm:px-8 lg:px-12 lg:py-12">
        <p class="text-sm text-[#8a7563]">Booking content will be added in later commits.</p>
      </div>
    </main>
  </div>

</body>
</html>
